<style>
/* Layout: cabecera tipo consola de monitoreo + pestañas; contenido en una columna con rejillas que se apilan en móvil */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#152030; --muted:#5A6A7E; --line:#D7DEE8;
  --accent:#1B66D2; --accent-ink:#FFFFFF; --accent-soft:#E3EDFB; --rec:#D23B2E;
  --good:#1E8A57; --good-soft:#E1F3EA; --warn:#B57C0F; --warn-soft:#FBF1DC; --bad:#C2392C; --bad-soft:#FBE5E2;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
  --hero:#0E2A4D; --hero-2:#16406F; --hero-ink:#F2F6FC; --hero-muted:#A9BEDA; --hero-tab:#CFDDF0;
  --c1:#1B66D2; --c1s:#E2ECFB; --c2:#0E8C7E; --c2s:#DDF3F0; --c3:#C25A12; --c3s:#FBEADB;
  --c4:#7A3FC4; --c4s:#EEE5FA; --c5:#C2305A; --c5s:#FBE2EA; --c6:#4F7A12; --c6s:#E9F2DA;
  --shadow:0 1px 2px rgba(14,42,77,.06),0 6px 18px rgba(14,42,77,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#161F2B; --surface-2:#1B2533; --ink:#E5EBF2; --muted:#92A1B4; --line:#2A3646;
  --accent:#5A9BFF; --accent-ink:#0B1320; --accent-soft:#1C2D47; --rec:#FF6B5E;
  --good:#4CC489; --good-soft:#15362A; --warn:#E5B24A; --warn-soft:#3A2F14; --bad:#FF7C6E; --bad-soft:#3E1D1A;
  --c1:#6AA6FF; --c1s:#1A2C47; --c2:#3FD0BE; --c2s:#123733; --c3:#FF9A55; --c3s:#3B2414;
  --c4:#B48CFF; --c4s:#2B2040; --c5:#FF7398; --c5s:#3D1A26; --c6:#9CD15A; --c6s:#25331A;
  --hero:#0A1E38; --hero-2:#12325A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#161F2B; --surface-2:#1B2533; --ink:#E5EBF2; --muted:#92A1B4; --line:#2A3646;
  --accent:#5A9BFF; --accent-ink:#0B1320; --accent-soft:#1C2D47; --rec:#FF6B5E;
  --good:#4CC489; --good-soft:#15362A; --warn:#E5B24A; --warn-soft:#3A2F14; --bad:#FF7C6E; --bad-soft:#3E1D1A;
  --c1:#6AA6FF; --c1s:#1A2C47; --c2:#3FD0BE; --c2s:#123733; --c3:#FF9A55; --c3s:#3B2414;
  --c4:#B48CFF; --c4s:#2B2040; --c5:#FF7398; --c5s:#3D1A26; --c6:#9CD15A; --c6s:#25331A;
  --hero:#0A1E38; --hero-2:#12325A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero)}
body{background-image:radial-gradient(1200px 380px at 85% -120px,color-mix(in srgb,var(--c2) 14%,transparent),transparent 70%),radial-gradient(900px 320px at 0% -80px,color-mix(in srgb,var(--c1) 12%,transparent),transparent 70%);background-repeat:no-repeat}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:linear-gradient(120deg,var(--hero) 0%,var(--hero-2) 100%);color:var(--hero-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 4px 18px rgba(8,24,46,.25)}
header.top::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px)}
header.top .wrap{position:relative;z-index:1}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}

  const docSnap=(c,id)=>{const v=(store[c]||{})[id];return {id,exists:!!v,data:()=>v?clone(v):undefined}};

function chart(list,col){ col=col||'var(--accent)';
  if(list.length<2)return `<p class="muted" style="margin:0">La gráfica aparece desde la segunda evaluación calificada.</p>`;
  const W=640,H=220,L=34,R=14,T=12,B=30,iw=W-L-R,ih=H-T-B;
  const x=i=>L+(list.length===1?iw/2:i*iw/(list.length-1)), y=v=>T+ih-(v/10)*ih;
  const pts=list.map((e,i)=>[x(i),y(e.nota)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1][0].toFixed(1)} ${T+ih} L${pts[0][0].toFixed(1)} ${T+ih} Z`;
  const ticks=[0,2,4,6,8,10]; const step=Math.ceil(list.length/6);
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución de notas">
   ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${t}</text>`).join('')}
   <line x1="${L}" x2="${W-R}" y1="${y(7)}" y2="${y(7)}" stroke="var(--warn)" stroke-dasharray="4 4" stroke-width="1"/>
   <path d="${area}" fill="${col}" fill-opacity=".14"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"/>
   ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?col:'var(--surface)'}" stroke="${col}" stroke-width="2"><title>${fmtDate(list[i].date)} · ${fmt(list[i].nota)}</title></circle>`).join('')}
   ${list.map((e,i)=>i%step===0||i===list.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtDate(e.date).slice(0,5)}</text>`:'').join('')}
  </svg></div><p class="muted" style="font-size:12px;margin:4px 0 0">Línea punteada: nota mínima esperada (7).</p>`;
}

function feed(op){

    if(r.type==='permiso')items.push({t:r.createdAt,d:r.date,ic:'PE',c:'var(--warn)',txt:`Permiso: salió ${r.out}, turno terminaba ${r.planned} (${fmtDur(spanMin(r.out,r.planned))}) · ${r.status}`});

/* ---------- asistencia ---------- */
const toMin=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return isNaN(h)?null:h*60+(m||0)};
const spanMin=(a,b)=>{const x=toMin(a),y=toMin(b);if(x==null||y==null)return null;let d=y-x;if(d<0)d+=1440;return d};
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fmtH=m=>{if(m==null||isNaN(m))return '—';const sg=m<0?'−':m>0?'+':'';m=Math.abs(Math.round(m));return sg+Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+' h'};
const fmtDur=m=>m==null?'—':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min';
const metaMes=()=>(settings&&+settings.mensual)||192;
const tolMin=()=>settings&&settings.tolerancia!=null?+settings.tolerancia:5;
const DEF_SHIFTS='Matutino principal 08:00-20:00\nApoyo matutino 11:00-20:00\nNocturno 20:00-08:00\nApoyo nocturno 20:00-06:00';
const shifts=()=>((settings&&settings.turnos)||DEF_SHIFTS).split('\n').map(l=>{const m=l.trim().match(/^(.+?)\s+(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})$/);return m?{name:m[1],start:m[2].padStart(5,'0'),end:m[3].padStart(5,'0')}:null}).filter(Boolean);
const shiftOpts=sel=>shifts().map((x,i)=>`<option value="${i}" ${sel===i?'selected':''}>${esc(x.name)} (${x.start}–${x.end})</option>`).join('')+`<option value="-1" ${sel===-1?'selected':''}>Sin horario fijo</option>`;
function guessShift(t){const n=toMin(t||nowHM());let best=-1,bd=1e9;shifts().forEach((x,i)=>{let d=Math.abs(n-toMin(x.start));d=Math.min(d,1440-d);if(d<bd){bd=d;best=i}});return bd<=180?best:-1}
function lateMin(r){if(isExtra(r)||r.type!=='turno'||!r.sched||!r.in)return 0;let d=toMin(r.in)-toMin(r.sched);if(d>720)d-=1440;if(d<-720)d+=1440;return d>tolMin()?d:0}
const nextDay=d=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+1);return x.toISOString().slice(0,10)};
function earlyMin(r){if(isExtra(r)||r.type!=='turno'||!r.schedEnd||!r.out)return 0;let d=toMin(r.schedEnd)-toMin(r.out);if(d>720)d-=1440;if(d<-720)d+=1440;return d>tolMin()?d:0}
const hasPermit=r=>att.some(p=>p.type==='permiso'&&p.operator===r.operator&&p.status!=='rechazado'&&(p.date===r.date||p.date===nextDay(r.date)));
const corrPend=r=>r.correction&&r.correction.status==='pendiente';
const needsReview=r=>(r.type!=='turno'&&r.status==='pendiente')||corrPend(r);
const shiftDone=r=>r.type==='turno'&&r.out&&r.status!=='rechazado'&&r.status!=='abierto';
const dayShift=(op,date,kind)=>att.find(r=>r.operator===op&&r.type==='turno'&&r.status!=='rechazado'&&r.date===date&&(kind==='extra'?isExtra(r):!isExtra(r)));
const unreadMemos=op=>memos.filter(m=>m.operator===op&&!m.readAt).length;
const jornada=metaMes;
const worked=r=>r.type==='turno'&&r.out?(r.inTs&&r.outTs?Math.round((r.outTs-r.inTs)/60000):spanMin(r.in,r.out)||0):0;
const elapsed=r=>r.inTs?Math.max(0,Math.round((Date.now()-r.inTs)/60000)):spanMin(r.in,nowHM());
const mesLabel=ym=>{const [y,m]=ym.split('-');return ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][+m-1]+' '+y};
const isExtra=r=>r&&r.kind==='extra';
const EXTRA_MOT=['Cubrir vacaciones','Cubrir permiso o falta','Otra novedad'];
function credited(r){const w=worked(r);if(isExtra(r)||!r.sched||!r.schedEnd)return w;
  let inOff=toMin(r.in)-toMin(r.sched);if(inOff>720)inOff-=1440;if(inOff<-720)inOff+=1440;const len=spanMin(r.sched,r.schedEnd)||w;
  return Math.max(0,Math.min(inOff+w,len)-Math.max(inOff,0))}
function monthly(op,extraRecs){const by={},xb={};att.filter(r=>r.operator===op&&shiftDone(r)).concat(extraRecs||[]).forEach(r=>{const k=(r.date||'').slice(0,7);
    if(isExtra(r))xb[k]=(xb[k]||0)+worked(r);else by[k]=(by[k]||0)+credited(r)});
  return [...new Set([...Object.keys(by),...Object.keys(xb)])].sort().reverse().map(k=>({ym:k,min:by[k]||0,extra:Math.max(0,(by[k]||0)-metaMes()*60),ot:xb[k]||0}))}
const earnedMin=op=>monthly(op).reduce((t,m)=>t+m.extra,0);
function attEffect(r){
  if(r.type==='turno')return 0;
  if(r.type==='permiso')return -(spanMin(r.out,r.planned)||0);
  if(r.type==='ajuste')return +r.minutes||0; return 0}
const balance=op=>earnedMin(op)+att.filter(r=>r.operator===op&&r.status==='aprobado').reduce((t,r)=>t+attEffect(r),0);
const openShift=op=>att.find(r=>r.operator===op&&r.type==='turno'&&r.status==='abierto');
const stPill=(st,r)=>r&&r.type==='turno'&&st!=='abierto'&&st!=='rechazado'?`<span class="pill p-good">${r.source==='manual'?'Registro manual':'Registrado'}</span>`:({aprobado:'<span class="pill p-good">Aprobado</span>',pendiente:'<span class="pill p-warn">Por aprobar</span>',rechazado:'<span class="pill p-bad">Rechazado</span>',abierto:'<span class="pill p-ok">En turno</span>'})[st]||'';
const effCell=r=>{if(r.status==='abierto')return '<span class="muted">—</span>';if(r.type==='turno'){if(isExtra(r))return `<b class="num" style="color:var(--c4)">${fmtDur(worked(r))} extras</b><div class="muted" style="font-size:12px">no suma a favor</div>`;const c=credited(r),w=worked(r);return `<span class="num">${fmtDur(c)} computables</span>${w-c>=1?`<div class="muted" style="font-size:12px">${fmtDur(w)} en total · tiempo fuera del horario no suma</div>`:''}`}const e=attEffect(r);return `<b class="num" style="color:${e>0?'var(--good)':e<0?'var(--bad)':'var(--muted)'}">${e===0?'0:00 h':fmtH(e)}</b>`};
function attDetail(r){
  if(r.type==='turno'){const l=lateMin(r);return `${isExtra(r)?`<span class="pill" style="background:var(--c4s);color:var(--c4)">Horas extras · ${esc(r.motive||'')}</span>${r.motiveDetail?` <span class="muted">${esc(r.motiveDetail)}</span>`:''}<br>`:''}${r.shift?`<span class="muted">${esc(r.shift)} ${r.sched}–${r.schedEnd||''}</span> · `:''}Entrada <b class="num">${r.in}</b> · Salida <b class="num">${r.out||'—'}</b>${r.out?` · trabajó ${fmtDur(worked(r))}`:''}${l?` · <b style="color:var(--bad)">atraso ${l} min</b>`:''}${earlyMin(r)?` · <b style="color:${hasPermit(r)?'var(--warn)':'var(--bad)'}">salió ${earlyMin(r)} min antes${hasPermit(r)?' (con permiso)':' sin permiso'}</b>`:''}${r.obsIn?`<div class="obs">Obs. ingreso: ${esc(r.obsIn)}</div>`:''}${r.obsOut?`<div class="obs">Obs. salida: ${esc(r.obsOut)}</div>`:''}`}
  if(r.type==='permiso')return `Salió <b class="num">${r.out}</b> (turno terminaba <b class="num">${r.planned}</b>)${r.reason?` · ${esc(r.reason)}`:''}`;
  return `Ajuste del supervisor${r.reason?` · ${esc(r.reason)}`:''}`}
const attType={turno:'Turno',permiso:'Permiso salida anticipada',ajuste:'Ajuste manual'};
function attTable(list,isAdmin,showOp){
  if(!list.length)return `<div class="empty">Sin registros todavía.</div>`;
  return `<div class="tablewrap"><table><thead><tr><th>Fecha</th>${showOp?'<th>Operador</th>':''}<th>Tipo</th><th>Detalle</th><th>Horas</th><th>Estado</th><th></th></tr></thead><tbody>
  ${list.map(r=>`<tr><td class="num">${fmtDate(r.date)}</td>${showOp?`<td><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="dot" style="${opVars(r.operator)}"></span>${esc(opName(r.operator))}</span></td>`:''}<td>${r.type==='turno'&&isExtra(r)?'Horas extras':attType[r.type]}</td><td>${attDetail(r)}${r.correction?`<div style="margin-top:6px;font-size:13px" class="${corrPend(r)?'':'muted'}"><span class="pill ${corrPend(r)?'p-warn':r.correction.status==='aprobada'?'p-good':'p-bad'}">Corrección ${corrPend(r)?'solicitada':r.correction.status}</span> ingreso <b class="num">${r.correction.in||r.in}</b>${r.correction.out?` · salida <b class="num">${r.correction.out}</b>`:''}${r.correction.reason?` · ${esc(r.correction.reason)}`:''}</div>`:''}</td><td>${effCell(r)}</td><td>${stPill(r.status,r)}</td>
   <td><div class="row" style="flex-wrap:nowrap">${isAdmin&&corrPend(r)?`<button class="btn small primary" type="button" data-corrok="${r.id}">Aprobar corrección</button><button class="btn small" type="button" data-corrno="${r.id}">Rechazar corrección</button>`:''}
   ${!isAdmin&&r.type==='turno'&&r.status!=='rechazado'&&!corrPend(r)?`<button class="btn small" type="button" data-corrreq="${r.id}">Solicitar corrección</button>`:''}
   ${isAdmin&&r.type!=='turno'&&r.status==='pendiente'?`<button class="btn small primary" type="button" data-attok="${r.id}">Aprobar</button><button class="btn small" type="button" data-attno="${r.id}">Rechazar</button>`:''}
   ${isAdmin&&r.type!=='turno'&&(r.status==='rechazado'||r.status==='aprobado')?`<button class="btn small" type="button" data-attreopen="${r.id}">Revisar</button>`:''}

function attForm(op,isAdmin){

  const head={corr:'Solicitar corrección de hora',turno:'Registrar turno completo',permiso:'Pedir permiso para salir antes',ajuste:'Ajuste manual de horas'}[f];

  if(f==='corr'){const r=att.find(x=>x.id===S.att.corrId)||{};body=`<div style="grid-column:1/-1" class="muted">Turno del <b>${fmtDate(r.date)}</b>${r.shift?' · '+esc(r.shift):''} · registrado: ingreso <b class="num">${r.in||'—'}</b>, salida <b class="num">${r.out||'—'}</b></div>
    <label class="f">Hora de ingreso correcta<input type="time" id="crIn" value="${r.in||''}" required></label><label class="f">Hora de salida correcta${r.out?'':' (si ya saliste)'}<input type="time" id="crOut" value="${r.out||''}"></label>

  try{await db.collection('evals').add({operator:f.op,formId:form.id,formTitle:form.title,questions:snapshotForm(form),answers:f.answers,scores:auto?r.scores:{},total:auto?r.total:0,max:formMax(form.questions),nota:auto?Math.round(r.nota*100)/100:0,
    comment:'',date:today(),status:auto?'calificada':'pendiente',source:'operador',createdAt:Date.now()});toast(auto?`Respuestas enviadas. Tu nota: ${fmt(r.nota)} / 10`:'Respuestas enviadas. El supervisor las calificará.');go('perfil',{op:f.op,ptab:'calificaciones'})}
  catch(e){toast('No se pudieron enviar. Pide al supervisor permiso para responder.')}
}
async function saveReview(){
  const e=evals.find(x=>x.id===S.review.id); const qs=e.questions||[];
  const empty=qs.findIndex(q=>S.review.scores[q.id]===''||S.review.scores[q.id]==null); if(empty>=0)return toast(`Asigna puntos a la pregunta ${empty+1}`);
  const scores={};let total=0;qs.forEach(q=>{const v=Math.max(0,Math.min(qMax(q),+S.review.scores[q.id]||0));scores[q.id]=v;total+=v});
  const max=formMax(qs),nota=max?Math.round(total/max*1000)/100:0;
  try{await db.doc('evals/'+e.id).update({scores,total,max,nota,comment:S.review.comment.trim(),status:'calificada',gradedAt:Date.now()});toast(`Calificación guardada · nota ${fmt(nota)}`);go('detail',{detail:e.id})}
  catch(err){toast('No se pudo guardar: '+(err.message||err.code))}
}
async function exportCsv(){
  const cal=evals.filter(e=>e.status==='calificada').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!cal.length)return toast('No hay evaluaciones calificadas para exportar');
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=['sep=,',['Fecha','Operador','Formulario','Puntos','Puntaje máximo','Nota (0-10)','Calificación','Origen','Comentario'].map(q).join(',')];
  cal.forEach(e=>lines.push([fmtDate(e.date),opName(e.operator),e.formTitle,fmt(e.total),fmt(e.max),fmt(e.nota),band(e.nota)[1],e.source==='operador'?'Respondido por operador':'Supervisor',e.comment].map(q).join(',')));
  lines.push('');lines.push(['Resumen por operador'].map(q).join(','));lines.push(['Operador','Evaluaciones','Promedio','Mejor','Más baja'].map(q).join(','));
  OPS.forEach(o=>{const s=opStats(o.id);lines.push([o.name,s.count,fmt(s.avg),fmt(s.best),fmt(s.worst)].map(q).join(','))});
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  if(!dlr)return toast('La descarga no está disponible en esta vista');
  try{const r=await dlr.save({filename:'control-operadores-'+today()+'.csv',data:blob});if(r&&r.status==='saved')toast('Archivo guardado')}catch(e){if(e&&e.code!=='declined')toast('No se pudo descargar')}
}

/* ---------- arranque ---------- */
setInterval(()=>{const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;if(loaded.att&&(me||S.view==='asistencia'||S.view==='perfil'))render()},60000);
render();
(async()=>{
  const timer=setTimeout(()=>{if(!(loaded.forms&&loaded.evals&&loaded.cfg&&loaded.acc&&loaded.att&&loaded.memos)){loaded={forms:true,evals:true,cfg:true,acc:true,att:true,memos:true};render()}},10000);
  try{db=await openDb()}catch(e){console.error(e);db=null}
  if(!db){clearTimeout(timer);dbFail=true;return render()}
  const fail=()=>{clearTimeout(timer);dbFail=true;render()};
  db.collection('forms').onSnapshot(s=>{forms=s.docs.map(d=>({id:d.id,...d.data()}));loaded.forms=true;done()},fail);
  db.collection('evals').onSnapshot(s=>{evals=s.docs.map(d=>({id:d.id,...d.data()}));loaded.evals=true;done()},fail);
  db.doc('config/admin').onSnapshot(s=>{cfg=s.exists?s.data():null;loaded.cfg=true;done()},fail);
  db.collection('memos').onSnapshot(s=>{memos=s.docs.map(d=>({id:d.id,...d.data()}));loaded.memos=true;done()},fail);
  db.collection('attendance').onSnapshot(s=>{att=s.docs.map(d=>({id:d.id,...d.data()}));loaded.att=true;done()},fail);
  db.doc('config/settings').onSnapshot(s=>{settings=s.exists?s.data():null;if(loaded.att)done()},()=>{});
  db.collection('accounts').onSnapshot(s=>{accounts={};s.docs.forEach(d=>accounts[d.id]=d.data());loaded.acc=true;
    if(me&&!accounts[me]){me=null;saveSess()} done()},fail);
  function done(){ if(loaded.forms&&loaded.evals&&loaded.cfg&&loaded.acc&&loaded.att&&loaded.memos)clearTimeout(timer);
    const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&['editor','evaluar','opfill','review','login','ajustes','cambiarpw','asistencia','perfil','formularios'].includes(S.view);
    if(typing){renderTabs();return} render() }
})();
</script>
