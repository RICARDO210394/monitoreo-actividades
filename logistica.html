<style>

body{margin:0;background:#F3F4F6;color:#111827;font-family:Inter,system-ui,sans-serif}

button{cursor:pointer}
h1,h2,h3,p{margin:0}
h2{font-size:18px;font-weight:700}
h3{font-size:17px;font-weight:700}
.wrap{max-width:1240px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:20px}
.kicker{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#4B5563}
h1{font-size:30px;font-weight:700}
nav{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid #D1D5DB}
.tab{min-height:44px;padding:0 18px;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:transparent;color:#4B5563;font-weight:600}

.card{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:12px;flex:1 1 220px}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.row.end{align-items:flex-end}

.sep-top{border-top:2px solid #D1D5DB;padding-top:16px}

.sm{font-size:13px;font-weight:600}

.g2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,150px);gap:12px}

.msg{padding:10px 12px;border-radius:8px;font-size:14px;font-weight:600}
.msg.ok{background:#DCFCE7;color:#166534}.msg.err{background:#FEE2E2;color:#991B1B}
.empty{background:#FFFFFF;border:1px dashed #9CA3AF;border-radius:12px;padding:36px 20px;text-align:center;color:#4B5563;font-size:15px}
.task{display:flex;flex-direction:column;gap:12px}
.date{font-size:13px;font-weight:600;color:#4B5563}
.desc{font-size:16px;font-weight:600;white-space:pre-wrap}

.foot{border-top:1px solid #F3F4F6;padding-top:12px}

.pill-cad,.pill-pend{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#FEE2E2;color:#991B1B}

.ring-n{font-weight:700;color:#111827}.ring-c{font-size:11px;font-weight:600;color:#4B5563}
.big{border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.legend{flex:1 1 200px;display:flex;flex-direction:column;gap:6px;font-size:14px}

.grid-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

.day-t{font-size:16px;font-weight:700}

.hday-wrap{padding:0;overflow:hidden}

.modal{max-height:calc(100vh - 32px);overflow:auto}
.lightbox{width:min(900px,calc(100% - 32px))}
.lightbox img{width:100%;max-height:75vh;object-fit:contain;border-radius:8px;background:#111827}
.primary:disabled{opacity:.6}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);z-index:60;min-width:260px;max-width:calc(100% - 32px);background:#111827;color:#FFFFFF;border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:0 12px 30px rgba(0,0,0,.3);transition:transform .25s ease}
.toast{pointer-events:none;visibility:hidden}
.toast.show{transform:translate(-50%,0);visibility:visible}
.toast span{font-size:13px;color:#D1D5DB}
.toast.green{background:#14532D}.toast.blue{background:#1E3A8A}.toast.red{background:#7F1D1D}
.pill-ok{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#DCFCE7;color:#166534}
.soundbar{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 16px;border:2px solid #F59E0B;border-radius:12px;background:#FFFBEB;color:#78350F;font-size:15px}
.soundbar span{font-size:13px;color:#92400E}
.desc-box .sub{margin-top:8px}
.fotos2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.group-h{padding-bottom:6px;border-bottom:2px solid #D1D5DB}

.alert-txt span{font-size:13px;color:#FECACA}

input:disabled{background:#F3F4F6;color:#4B5563}

@media (prefers-reduced-motion:reduce){.alert{animation:none}}

.field{display:flex;flex-direction:column;gap:6px}

.urg{min-height:44px;padding:0 16px;border:2px solid;border-radius:999px;background:#FFFFFF;color:#111827;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:8px}

@media (max-width:480px){.g2,.g2b,.g2c{grid-template-columns:minmax(0,1fr)}h1{font-size:24px}}

</style>

<script>

};

var MIGRADO_KEY = 'monitoreo-actividades-migrado';

var cloud = { ready: false, col: null, state: 'local', msg: '' };
function setSync(state, msg) { cloud.state = state; cloud.msg = msg || ''; renderSync(); }
function renderSync() {
  var el = document.getElementById('sync'); if (!el) return;
  var map = {
    local: ['Modo local · los datos solo están en este equipo', 'gray'],
    conectando: ['Conectando con la nube…', 'gray'],
    ok: ['Sincronizado en la nube', 'green'],
    guardando: ['Guardando en la nube…', 'amber'],
    offline: ['Sin conexión · se guardará al reconectar', 'amber'],
    error: ['Error de la nube: ' + cloud.msg, 'red']

  el.className = 'sync ' + m[1];

function syncCloud(old, tasks) {
  if (!cloud.ready) return;
  var oldMap = {}, newMap = {}, batch = firebase.firestore().batch(), n = 0;
  old.forEach(function (t) { oldMap[t.id] = t; });

    var db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(function () {});

      cloud.col = db.collection(COLECCION);
      cloud.col.onSnapshot({ includeMetadataChanges: true }, function (snap) {

            var faltan = S.tasks.filter(function (t) { return !ids[t.id]; });

        S.tasks = remote;

function findClaude() {
  var ws = [window];
  try { if (window.parent && window.parent !== window) ws.push(window.parent); } catch (e) {}
  try { if (window.top && ws.indexOf(window.top) < 0) ws.push(window.top); } catch (e) {}
  for (var i = 0; i < ws.length; i++) { try { var c = ws[i].claude; if (c && typeof c.use === 'function') return c; } catch (e) {} }
  return null;
}
function saveFile(filename, bytes, mime) {

    var url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    var a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return 'saved';
  };
  if (!c) return Promise.resolve(viaAnchor());
  return c.use('downloads').then(function (dl) {
    if (!dl) return viaAnchor();
    return dl.save({ filename: filename, data: new Blob([bytes], { type: mime }) }).then(function (r) { return r.status; });
  });
}

/* ---------- Sonidos, avisos y notificaciones ---------- */
function tones(notes, type, gain) {
  unlockAudio(); if (!audioCtx) return;
  try {
    var t0 = audioCtx.currentTime;
    notes.forEach(function (n) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t0 + n[1]);
      g.gain.exponentialRampToValueAtTime(gain || 0.3, t0 + n[1] + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + n[1] + n[2]);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0 + n[1]); o.stop(t0 + n[1] + n[2] + 0.05);
    });
  } catch (e) {}
}
function chimeNew() { tones([[784, 0, 0.35], [1047, 0.18, 0.5]], 'sine', 0.35); }
function chimeFail() { tones([[523, 0, 0.3], [392, 0.2, 0.55]], 'triangle', 0.35); }
function chimeDone() { tones([[523, 0, 0.3], [659, 0.14, 0.3], [784, 0.28, 0.55]], 'triangle', 0.35); }
var toastT = null;
function toast(title, body, kind) {
  var el = document.getElementById('toast'); if (!el) return;
  el.className = 'toast show ' + (kind || '');
  el.innerHTML = '<b>' + esc(title) + '</b>' + (body ? '<span>' + esc(body) + '</span>' : '');
  clearTimeout(toastT); toastT = setTimeout(function () { el.className = 'toast'; }, 6000);
}
function sysNotify(title, body) {
  if (notifPerm() !== 'granted' || document.visibilityState === 'visible') return;
  try { var n = new Notification(title, { body: body, tag: 'monitoreo-' + Date.now() }); n.onclick = function () { window.focus(); n.close(); }; } catch (e) {}
}
function avisoNueva(t, remoto) {
  chimeNew();
  toast(remoto ? 'Nueva consigna asignada' : 'Consigna registrada', t.urgencia + ' · ' + t.descripcion + ' · ' + fmtTime(t.creado) + (t.fotosRef && t.fotosRef.length ? ' · con ' + plural(t.fotosRef.length, 'foto', 'fotos') : ''), 'blue');
  sysNotify('Nueva consigna (' + t.urgencia + ')', t.descripcion + (t.solicitante ? ' · ' + t.solicitante : ''));
}
function avisoCierre(t) {
  if (t.estado === 'Realizada') {
    chimeDone();
    toast('Actividad cumplida', t.descripcion + ' · ' + fmtTime(t.cerrado) + (t.fotos && t.fotos.length ? ' · ' + plural(t.fotos.length, 'foto', 'fotos') : ''), 'green');
    sysNotify('Actividad cumplida', t.descripcion + ' · ' + fmtTime(t.cerrado));
  } else {
    chimeFail();
    toast('Actividad no cumplida', t.descripcion + (t.comentario ? ' · ' + t.comentario : ''), 'red');
    sysNotify('Actividad no cumplida', t.descripcion);
  }
}
/* llamado por la nube cuando llegan cambios de otros equipos */
function onRemoteChanges(prev, next) {
  var old = {}; prev.forEach(function (t) { old[t.id] = t; });
  next.forEach(function (t) {
    var o = old[t.id];
    if (!o) { if (t.creado && Date.now() - t.creado < 10 * 60000) avisoNueva(t, true); }
    else if (o.estado !== t.estado && (t.estado === 'Realizada' || t.estado === 'No cumplida')) avisoCierre(t);
  });
}

function saveCierre() {
  var c = S.cl; if (!c || c.busy) return;
  var t = findTask(c.id); if (!t) return set({ cl: null });
  c.nuevas.forEach(putFoto);
  (t.fotos || []).forEach(function (id) { if (c.keep.indexOf(id) < 0) delFoto(id); });
  var upd = {
    estado: c.estado, comentario: c.text.trim(),
    cerrado: c.edit && t.cerrado ? t.cerrado : Date.now(),
    fotos: c.keep.concat(c.nuevas.map(function (f) { return f.id; }))
  };
  persist(S.tasks.map(function (x) { return x.id === c.id ? Object.assign({}, x, upd) : x; }));
  S.cl = null; render();
  if (!c.edit) avisoCierre(findTask(c.id));
}
document.addEventListener('change', function (e) {
  var inp = e.target;
  if (!inp.getAttribute || !inp.getAttribute('data-fotos') || !S.cl) return;
  var files = Array.prototype.slice.call(inp.files || [], 0, MAX_FOTOS - S.cl.keep.length - S.cl.nuevas.length);
  if (!files.length) return;
  S.cl.busy = true; render();
  Promise.all(files.map(function (f) { return compressImage(f).catch(function () { return null; }); })).then(function (list) {
    if (!S.cl) return;
    S.cl.nuevas = S.cl.nuevas.concat(list.filter(Boolean)); S.cl.busy = false; render();
  });
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (S.verFoto) set({ verFoto: null }); else if (S.cl) set({ cl: null });

document.addEventListener('change', function (e) {
  var inp = e.target;

var ALARM_KEY = 'monitoreo-actividades-alarma';

try { var _al = JSON.parse(localStorage.getItem(ALARM_KEY) || '{}'); if (_al.every) AL.every = _al.every; } catch (e) {}
var audioCtx = null;

}

var baseTitle = document.title, flashT = null;

  S.expDay = resDate;
  var rows = S.tasks.filter(function (t) { return t.fecha === resDate; })
    .sort(function (a, b) { return (EST_RANK[a.estado] - EST_RANK[b.estado]) || (URG_RANK[a.urgencia] - URG_RANK[b.urgencia]) || (a.creado - b.creado); });
  if (!rows.length) return set({ expMsg: 'No hay tareas registradas el ' + fmtDate(resDate) + ' para el reporte.', expErr: true });
  var st = stats(rows, today, 10), enPlazo = st.pend - st.venc;
  var pct = Math.round((st.done / st.total) * 100) + '%';
  var summary = {
    main: (resDate === today ? 'Realizado hoy: ' : 'Realizado: ') + pct + ' de 100% (' + st.done + ' de ' + st.total + ' tareas)',
    ratio: st.done / st.total,
    nums: { done: st.done, pend: enPlazo, venc: st.venc, fail: st.fail, total: st.total },
    compare: st.done === st.total ? 'Meta alcanzada: 100% de 100%' : pct + ' de 100% · faltan ' + (100 - Math.round((st.done / st.total) * 100)) + ' puntos (' + (st.total - st.done) + ' tareas)',
    detail: 'Realizadas: ' + st.done + '   ·   Pendientes: ' + enPlazo + '   ·   Caducadas: ' + st.venc + '   ·   No cumplidas: ' + st.fail + '   ·   Total: ' + st.total,
    cells: [['% Realizado', pct], ['% Máximo (meta)', '100%'], ['Diferencia con el máximo', (100 - Math.round((st.done / st.total) * 100)) + ' puntos'], ['Realizadas', String(st.done)], ['Pendientes', String(enPlazo)], ['Caducadas', String(st.venc)], ['No cumplidas', String(st.fail)], ['Total de tareas', String(st.total)]]
  };
  var now = new Date();
  var title = 'Reporte diario de encargos – ' + fmtDate(resDate);
  var sub = 'Monitoreo de Actividades · Generado: ' + fmtDate(today) + ' ' + ('0' + now.getHours()).slice(-2) + ':' + ('0' + now.getMinutes()).slice(-2);
  var name = 'reporte-encargos-' + resDate + '.' + kind;
  var ids = []; rows.forEach(function (t) { (t.fotos || []).forEach(function (x) { ids.push(x); }); });
  set({ expMsg: 'Preparando el reporte…', expErr: false });
  Promise.all(ids.map(function (x) { return getFoto(x).catch(function () { return null; }); })).then(function (list) {
  var fotos = {}; list.forEach(function (f) { if (f) fotos[f.id] = f; });
  try {
    var bytes = kind === 'pdf' ? buildPdf(rows, title, sub, summary, fotos) : buildXlsx(rows, title, sub, summary);
    saveFile(name, bytes, kind === 'pdf' ? 'application/pdf' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')
      .then(function () { set({ expMsg: 'Archivo listo: ' + name, expErr: false }); }, function () { set({ expMsg: 'No se pudo descargar el archivo.', expErr: true }); });
  } catch (e) { set({ expMsg: 'No se pudo generar el archivo.', expErr: true }); }
  });
}
document.addEventListener('click', function (ev) {
  unlockAudio();
  var b = ev.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act'), v = b.getAttribute('data-val'), id = b.getAttribute('data-id');
  if (a === 'tab') set({ tab: v });
  else if (a === 'save') save();
  else if (a === 'cancel') set({ editId: null, error: '', form: emptyForm(todayStr()), formNuevas: [] });
  else if (a === 'refrmkeep') { S.form.fotosRef.splice(+v, 1); render(); }
  else if (a === 'refrmnew') { S.formNuevas.splice(+v, 1); render(); }
  else if (a === 'activarsonido') { S.sonidoPedido = true; unlockAudio(); try { if (notifPerm() === 'default') Notification.requestPermission().then(function () { render(); }); } catch (e) {} setTimeout(function () { chimeNew(); render(); }, 150); }
  else if (a === 'estado' && (v === 'No cumplida' || v === 'Realizada')) openCierre(id, v);
  else if (a === 'nccomment') { var tc = findTask(id); if (tc) openCierre(id, tc.estado); }
  else if (a === 'clsave') saveCierre();
  else if (a === 'clcancel') set({ cl: null });
  else if (a === 'clrmkeep') { S.cl.keep.splice(+v, 1); render(); }
  else if (a === 'clrmnew') { S.cl.nuevas.splice(+v, 1); render(); }
  else if (a === 'verfoto') { set({ verFoto: v }); getFoto(v).then(function () { render(); }); }
  else if (a === 'cerrarfoto') set({ verFoto: null });
  else if (a === 'estado') { persist(S.tasks.map(function (x) { return x.id === id ? Object.assign({}, x, { estado: v, cerrado: null }) : x; })); render(); }
  else if (a === 'edit') {
    var t = findTask(id); if (!t) return;
    set({ tab: 'registro', editId: id, error: '', ok: '', form: { fecha: t.fecha, plazo: t.plazo || '', solicitante: t.solicitante, tipo: t.tipo, lugar: t.lugar, descripcion: t.descripcion, direccion: t.direccion, entrega: t.entrega, urgencia: t.urgencia, fotosRef: (t.fotosRef || []).slice() }, formNuevas: [] });
    window.scrollTo(0, 0);
  }
  else if (a === 'del') {
    if (!window.confirm('¿Eliminar este encargo?')) return;
    var td = findTask(id); if (td) (td.fotos || []).concat(td.fotosRef || []).forEach(delFoto);
    persist(S.tasks.filter(function (x) { return x.id !== id; }));
    if (S.editId === id) S.editId = null;
    render();
  }
  else if (a === 'resday') set({ resDate: v, expMsg: '' });
  else if (a === 'exp') doExport(v, id);
  else if (a === 'histday') set({ histOpen: S.histOpen === v ? null : v, expMsg: '' });
  else if (a === 'urg') {
    var td = todayStr(), tm = addDays(td, 1), p = S.form.plazo;
    if (v === 'Crítica') p = td;
    else if (v === 'Alta') p = (p === td || p === tm) ? p : td;
    else if (p && p < td) p = '';
    S.form.urgencia = v; S.form.plazo = p; S.error = ''; S.ok = ''; render();
  }
  else if (a === 'plazo') { S.form.plazo = v; render(); }
  else if (a === 'notif') { try { Notification.requestPermission().then(render); } catch (e) {} }
  else if (a === 'test') beep();
  else if (a === 'cpview') set({ cpView: v });
  else if (a === 'cptype') set({ cpType: v });
  else if (a === 'cpall') set({ cpDate: '' });
  else if (a === 'histf') set({ histFilter: v });
  else if (a === 'histclear') set({ histFilter: 'Todas', histQ: '', histFrom: '', histTo: '' });
});
document.addEventListener('input', function (ev) {
  var t = ev.target, k = t.getAttribute && t.getAttribute('data-field');
  if (k) { S.form[k] = t.value; if (S.ok || S.error) { S.ok = ''; S.error = ''; } if (k === 'urgencia' || (k === 'fecha' && S.form.urgencia === 'Crítica')) render(); return; }
  if (t.getAttribute && t.getAttribute('data-alarm')) { AL.every = +t.value; try { localStorage.setItem(ALARM_KEY, JSON.stringify({ every: AL.every })); } catch (e) {} return; }
  if (t.getAttribute && t.getAttribute('data-modal')) { if (S.cl) S.cl.text = t.value; return; }
  k = t.getAttribute && t.getAttribute('data-filter');
  if (k) { S[k] = t.value; render(); }
});
window.addEventListener('storage', function (e) { if (e.key === STORE_KEY && !cloud.ready) { S.tasks = loadTasks(); render(); } });
render();
if (criticas().length) setTimeout(alarm, 1500);
startCloud();

if ('serviceWorker' in navigator && /github\.io|web\.app|firebaseapp\.com|netlify\.app/.test(location.hostname)) {
  navigator.serviceWorker.register('sw-logistica.js').then(function (reg) {
    reg.addEventListener('updatefound', function () { var nw = reg.installing; nw && nw.addEventListener('statechange', function () { if (nw.state === 'activated' && navigator.serviceWorker.controller) location.reload(); }); });
  }).catch(function () {});
}
